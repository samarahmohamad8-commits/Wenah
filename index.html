<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071d19">
<title>Wenah | وينه؟</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{
  --bg:#061b17;
  --card:#0d2923;
  --card2:#103129;
  --green:#21e6a0;
  --text:#f4fffb;
  --muted:#91aaa3;
  --line:rgba(255,255,255,.09);
}

*{
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 85% 0,#115944,transparent 30%),
    var(--bg);
  color:var(--text);
}

.app{
  max-width:760px;
  margin:auto;
  padding:16px 16px 35px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:23px;
  font-weight:900;
}

.mark{
  width:40px;
  height:40px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#27f0aa,#07906b);
}

.badge{
  color:var(--green);
  border:1px solid rgba(33,230,160,.2);
  background:rgba(33,230,160,.08);
  padding:8px 11px;
  border-radius:99px;
  font-size:11px;
  font-weight:800;
}

.hero{
  padding:25px 0 10px;
}

.eyebrow{
  color:var(--green);
  font-weight:800;
  font-size:14px;
}

.hero h1{
  font-size:44px;
  line-height:1;
  margin:9px 0 12px;
}

.hero h1 span{
  color:var(--green);
}

.hero p{
  color:var(--muted);
  line-height:1.8;
  font-size:14px;
  margin:0 0 18px;
}

.search{
  display:flex;
  gap:8px;
  padding:7px;
  background:#0a2721;
  border:1px solid var(--line);
  border-radius:17px;
}

.search input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  padding:11px;
  font-size:15px;
}

.btn{
  border:0;
  border-radius:13px;
  background:var(--green);
  color:#05281f;
  font-weight:900;
  padding:11px 17px;
  cursor:pointer;
}

.location-btn{
  width:100%;
  margin:10px 0 8px;
  padding:14px;
  border:0;
  border-radius:15px;
  background:#10362e;
  color:#eafff8;
  font-weight:850;
  cursor:pointer;
}

.status{
  min-height:22px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin:7px;
}

.categories{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:5px 0 12px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  flex:none;
  border:1px solid var(--line);
  background:#0b2721;
  color:#e5f7f2;
  border-radius:999px;
  padding:9px 13px;
  cursor:pointer;
  font-size:12px;
}

.category.active{
  background:var(--green);
  color:#05281f;
  border-color:var(--green);
  font-weight:900;
}

.map{
  height:330px;
  border-radius:22px;
  overflow:hidden;
  border:1px solid var(--line);
  box-shadow:0 20px 60px #0005;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 0 10px;
}

.section-head h2{
  margin:0;
  font-size:19px;
}

.count{
  color:var(--muted);
  font-size:11px;
}

.results{
  display:grid;
  gap:9px;
}

.result{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px;
  border-radius:17px;
  background:linear-gradient(145deg,#103129,#0a241f);
  border:1px solid var(--line);
  cursor:pointer;
}

.result-icon{
  width:50px;
  height:50px;
  flex:none;
  border-radius:14px;
  background:#0b241f;
  display:grid;
  place-items:center;
  font-size:24px;
}

.result-info{
  flex:1;
  min-width:0;
}

.result-info strong{
  display:block;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.result-info small{
  display:block;
  color:var(--muted);
  margin-top:4px;
  font-size:11px;
}

.distance{
  color:var(--green);
  font-weight:900;
  font-size:11px;
  white-space:nowrap;
}

.empty{
  padding:28px 15px;
  text-align:center;
  color:var(--muted);
  background:#0b2721;
  border-radius:17px;
  line-height:1.7;
}

.detail{
  position:fixed;
  left:12px;
  right:12px;
  bottom:12px;
  max-width:736px;
  margin:auto;
  background:#0b2721;
  border:1px solid var(--line);
  border-radius:23px;
  padding:17px;
  box-shadow:0 25px 90px #0009;
  display:none;
  z-index:5000;
}

.detail.show{
  display:block;
}

.detail-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.detail-icon{
  font-size:30px;
}

.detail h3{
  margin:4px 0 7px;
  font-size:21px;
}

.detail-distance{
  color:var(--green);
  font-weight:900;
}

.detail-type{
  color:var(--muted);
  font-size:12px;
  margin:12px 0;
}

.close{
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:#ffffff10;
  color:#fff;
  cursor:pointer;
}

.detail-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.detail-actions button{
  border:0;
  border-radius:13px;
  padding:12px;
  font-weight:900;
  cursor:pointer;
}

.primary{
  background:var(--green);
  color:#05281f;
}

.secondary{
  background:#15382f;
  color:#dff8f0;
}

footer{
  text-align:center;
  color:#6f8d85;
  font-size:11px;
  padding:25px 0 8px;
}

.bottom-nav{
  position:sticky;
  bottom:8px;
  margin-top:17px;
  background:rgba(7,29,25,.93);
  backdrop-filter:blur(15px);
  border:1px solid var(--line);
  border-radius:18px;
  padding:6px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.nav-btn{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:8px;
  border-radius:13px;
  cursor:pointer;
  font-size:11px;
}

.nav-btn.active{
  color:var(--green);
  background:#21e6a018;
  font-weight:900;
}

.toast{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translateX(-50%);
  background:#102f28;
  border:1px solid var(--line);
  padding:11px 15px;
  border-radius:13px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:9999;
  font-size:12px;
}

.toast.show{
  opacity:1;
}

@media(max-width:500px){
  .hero h1{
    font-size:38px;
  }

  .map{
    height:300px;
  }

  .result{
    padding:10px;
  }

  .result-icon{
    width:45px;
    height:45px;
  }
}
</style>
</head>

<body>

<main class="app">

  <div class="top">
    <div class="logo">
      <div class="mark">📍</div>
      Wenah <span style="color:var(--green)">| وينه؟</span>
    </div>

    <div class="badge">● قريب منك</div>
  </div>

  <section class="hero">

    <div class="eyebrow">كل شيء قريب منك.</div>

    <h1>
      وينه؟ <span>لقيته.</span>
    </h1>

    <p>
      حدد موقعك وابحث عن المكان الذي تريده.
      Wenah يعرض لك الأماكن القريبة مرتبة من الأقرب إلى الأبعد.
    </p>

    <div class="search">
      <input
        id="searchInput"
        type="text"
        placeholder="مثلاً: مطعم، قهوة، صيدلية..."
        onkeydown="if(event.key==='Enter') searchPlaces()"
      >

      <button class="btn" onclick="searchPlaces()">
        بحث
      </button>
    </div>

    <button class="location-btn" onclick="getLocation()">
      📍 استخدم موقعي
    </button>

    <div id="status" class="status"></div>

  </section>

  <!-- الفئات -->
  <div class="categories">

    <button
      class="category active"
      data-category="all"
      onclick="selectCategory(this,'all')">
      ✨ الكل
    </button>

    <button
      class="category"
      data-category="restaurant"
      onclick="selectCategory(this,'restaurant')">
      🍔 مطاعم
    </button>

    <button
      class="category"
      data-category="cafe"
      onclick="selectCategory(this,'cafe')">
      ☕ كافيهات
    </button>

    <button
      class="category"
      data-category="pharmacy"
      onclick="selectCategory(this,'pharmacy')">
      💊 صيدليات
    </button>

    <button
      class="category"
      data-category="fuel"
      onclick="selectCategory(this,'fuel')">
      ⛽ بنزين
    </button>

    <button
      class="category"
      data-category="supermarket"
      onclick="selectCategory(this,'supermarket')">
      🛒 سوبرماركت
    </button>

    <button
      class="category"
      data-category="atm"
      onclick="selectCategory(this,'atm')">
      🏧 ATM
    </button>

  </div>

  <!-- الخريطة -->
  <div id="map" class="map"></div>

  <div class="section-head">
    <h2>الأماكن القريبة</h2>
    <span id="count" class="count">حدد موقعك أولاً</span>
  </div>

  <div id="results" class="results">
    <div class="empty">
      📍 اضغط «استخدم موقعي» حتى نعرض الأماكن حولك.
    </div>
  </div>

  <footer>
    Wenah — وينه؟ • اكتشف أقرب مكان بسهولة.
  </footer>

  <div class="bottom-nav">

    <button class="nav-btn active"
      onclick="window.scrollTo({top:0,behavior:'smooth'})">
      🏠<br>الرئيسية
    </button>

    <button class="nav-btn"
      onclick="document.getElementById('searchInput').focus()">
      🔎<br>بحث
    </button>

    <button class="nav-btn"
      onclick="showFavorites()">
      ❤️<br>المفضلة
    </button>

  </div>

</main>

<!-- نافذة التفاصيل -->
<div id="detail" class="detail">

  <div class="detail-head">

    <div>
      <div id="detailIcon" class="detail-icon">📍</div>

      <h3 id="detailName">
        مكان قريب
      </h3>

      <div id="detailDistance" class="detail-distance"></div>
    </div>

    <button class="close" onclick="closeDetail()">
      ✕
    </button>

  </div>

  <div id="detailType" class="detail-type"></div>

  <div class="detail-actions">

    <button class="primary" onclick="openDirections()">
      🧭 الاتجاهات
    </button>

    <button
      id="favoriteButton"
      class="secondary"
      onclick="toggleFavorite()">
      ♡ حفظ بالمفضلة
    </button>

  </div>

</div>

<div id="toast" class="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   إعداد الخريطة
========================= */

const map = L.map('map').setView([32.05,35.93],12);

L.control.zoom({
  position:'bottomright'
}).addTo(map);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom:19,
    attribution:'© OpenStreetMap'
  }
).addTo(map);


/* =========================
   المتغيرات
========================= */

let userLocation = null;
let markers = [];
let selectedPlace = null;

let favorites = JSON.parse(
  localStorage.getItem('wenahFavorites') || '[]'
);

let selectedCategory = 'all';

const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
const countEl = document.getElementById('count');


/* =========================
   تحديد الموقع
========================= */

function getLocation(){

  statusEl.textContent =
    '📍 جاري تحديد موقعك...';

  if(!navigator.geolocation){

    statusEl.textContent =
      '❌ المتصفح لا يدعم تحديد الموقع.';

    return;
  }

  navigator.geolocation.getCurrentPosition(

    position => {

      userLocation = [
        position.coords.latitude,
        position.coords.longitude
      ];

      map.setView(userLocation,15);

      clearMarkers();

      const userMarker =
        L.circleMarker(
          userLocation,
          {
            radius:9,
            color:'#071d19',
            weight:4,
            fillColor:'#21e6a0',
            fillOpacity:1
          }
        )
        .addTo(map)
        .bindPopup('📍 موقعك');

      markers.push(userMarker);

      statusEl.textContent =
        '✅ تم تحديد موقعك';

      loadPlaces();

    },

    () => {

      statusEl.textContent =
        '❌ اسمح للموقع من Edge حتى نقدر نحدد الأماكن القريبة.';

    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }

  );
}


/* =========================
   اختيار الفئة
========================= */

function selectCategory(button,category){

  document
    .querySelectorAll('.category')
    .forEach(btn => btn.classList.remove('active'));

  button.classList.add('active');

  selectedCategory = category;

  if(!userLocation){

    statusEl.textContent =
      '📍 حدد موقعك أولاً.';

    getLocation();

    return;
  }

  loadPlaces();

}


/* =========================
   البحث
========================= */

function searchPlaces(){

  const input =
    document
      .getElementById('searchInput')
      .value
      .trim()
      .toLowerCase();

  /*
   إذا كتب المستخدم كلمة معروفة
   نحدد الفئة تلقائياً.
  */

  if(
    input.includes('مطعم') ||
    input.includes('مطاعم') ||
    input.includes('restaurant') ||
    input.includes('burger') ||
    input.includes('برغر')
  ){
    selectedCategory='restaurant';
    setActiveCategory('restaurant');
  }

  else if(
    input.includes('كافيه') ||
    input.includes('كافيهات') ||
    input.includes('قهوة') ||
    input.includes('coffee') ||
    input.includes('cafe')
  ){
    selectedCategory='cafe';
    setActiveCategory('cafe');
  }

  else if(
    input.includes('صيدلية') ||
    input.includes('صيدليات') ||
    input.includes('pharmacy')
  ){
    selectedCategory='pharmacy';
    setActiveCategory('pharmacy');
  }

  else if(
    input.includes('بنزين') ||
    input.includes('محطة') ||
    input.includes('fuel') ||
    input.includes('gas')
  ){
    selectedCategory='fuel';
    setActiveCategory('fuel');
  }

  else if(
    input.includes('سوبر') ||
    input.includes('سوبرماركت') ||
    input.includes('ماركت') ||
    input.includes('supermarket')
  ){
    selectedCategory='supermarket';
    setActiveCategory('supermarket');
  }

  else if(
    input.includes('atm') ||
    input.includes('صراف') ||
    input.includes('صراف آلي')
  ){
    selectedCategory='atm';
    setActiveCategory('atm');
  }

  /*
   إذا كانت كلمة عامة أو اسم مكان،
   نستخدم البحث النصي فقط.
  */

  if(!userLocation){

    statusEl.textContent =
      '📍 حدد موقعك أولاً.';

    getLocation();

    return;
  }

  loadPlaces(input);

}


/* =========================
   تفعيل زر الفئة
========================= */

function setActiveCategory(category){

  document
    .querySelectorAll('.category')
    .forEach(btn => {

      btn.classList.toggle(
        'active',
        btn.dataset.category === category
      );

    });

}


/* =========================
   تنظيف الماركرات
========================= */

function clearMarkers(){

  markers.forEach(marker => {

    try{
      map.removeLayer(marker);
    }catch(e){}

  });

  markers=[];
}


/* =========================
   إعداد بحث Overpass
========================= */

function getOverpassFilter(category,searchText){

  /*
   أهم جزء:
   كل فئة لها فلتر خاص بها.
   لذلك المطاعم لن ترجع صيدليات
   أو مستشفيات.
  */

  if(category === 'restaurant'){
    return `
      nwr(
        around:5000,
        LAT,
        LON
      )["amenity"="restaurant"];
    `;
  }

  if(category === 'cafe'){
    return `
      nwr(
        around:5000,
        LAT,
        LON
      )["amenity"="cafe"];
    `;
  }

  if(category === 'pharmacy'){
    return `
      nwr(
        around:5000,
        LAT,
        LON
      )["amenity"="pharmacy"];
    `;
  }

  if(category === 'fuel'){
    return `
      nwr(
        around:5000,
        LAT,
        LON
      )["amenity"="fuel"];
    `;
  }

  if(category === 'supermarket'){
    return `
      nwr(
        around:5000,
        LAT,
        LON
      )["shop"="supermarket"];
    `;
  }

  if(category === 'atm'){
    return `
      nwr(
        around:5000,
        LAT,
        LON
      )["amenity"="atm"];
    `;
  }

  /*
   البحث العام:
   نبحث عن الأماكن التي لها اسم.
  */

  if(searchText){

    return `
      nwr(
        around:5000,
        LAT,
        LON
      )["name"];
    `;
  }

  /*
   الكل:
   مجموعة أماكن محددة فقط،
   وليس كل شيء على الخريطة.
  */

  return `
    nwr(
      around:5000,
      LAT,
      LON
    )["amenity"~"restaurant|cafe|pharmacy|fuel|atm"];

    nwr(
      around:5000,
      LAT,
      LON
    )["shop"="supermarket"];
  `;
}


/* =========================
   تحميل الأماكن
========================= */

async function loadPlaces(searchText=''){

  statusEl.textContent =
    '🔎 جاري البحث عن الأماكن...';

  resultsEl.innerHTML =
    '<div class="empty">جاري البحث...</div>';

  countEl.textContent='';

  clearMarkers();

  /*
   إعادة وضع موقع المستخدم
  */

  if(userLocation){

    const userMarker =
      L.circleMarker(
        userLocation,
        {
          radius:9,
          color:'#071d19',
          weight:4,
          fillColor:'#21e6a0',
          fillOpacity:1
        }
      )
      .addTo(map)
      .bindPopup('📍 موقعك');

    markers.push(userMarker);
  }


  const lat=userLocation[0];
  const lon=userLocation[1];

  let queryFilter =
    getOverpassFilter(
      selectedCategory,
      searchText
    );

  queryFilter =
    queryFilter
      .replaceAll('LAT',lat)
      .replaceAll('LON',lon);

  /*
   إذا كتب المستخدم اسم محدد،
   نضيف فلترة محلية بعد جلب النتائج.
  */

  const overpassQuery = `
    [out:json][timeout:25];

    (
      ${queryFilter}
    );

    out center tags;
  `;


  const endpoints=[
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter'
  ];


  try{

    let data=null;

    for(const endpoint of endpoints){

      try{

        const response =
          await fetch(
            endpoint +
            '?data=' +
            encodeURIComponent(overpassQuery)
          );

        if(!response.ok){
          throw new Error(
            'HTTP '+response.status
          );
        }

        data=await response.json();

        break;

      }catch(error){

        console.log(
          'Overpass endpoint failed:',
          error
        );

      }

    }


    if(!data){
      throw new Error('No data');
    }


    let places =
      (data.elements || [])
      .map(element => {

        const latitude =
          element.lat ??
          element.center?.lat;

        const longitude =
          element.lon ??
          element.center?.lon;

        const tags =
          element.tags || {};

        return {

          lat:latitude,

          lon:longitude,

          name:
            tags['name:ar'] ||
            tags.name ||
            tags['name:en'] ||
            'مكان بدون اسم',

          type:
            tags.amenity ||
            tags.shop ||
            '',

          phone:
            tags.phone ||
            '',

          distance:
            calculateDistance(
              lat,
              lon,
              latitude,
              longitude
            )

        };

      })
      .filter(place =>
        Number.isFinite(place.lat) &&
        Number.isFinite(place.lon)
      );


    /*
     فلترة البحث بالاسم إذا كتب المستخدم
     شيئاً غير اسم الفئة.
    */

    if(searchText){

      const text =
        searchText
          .toLowerCase()
          .trim();

      const isCategoryWord =
        [
          'مطعم',
          'مطاعم',
          'restaurant',
          'burger',
          'برغر',
          'كافيه',
          'كافيهات',
          'قهوة',
          'coffee',
          'cafe',
          'صيدلية',
          'صيدليات',
          'pharmacy',
          'بنزين',
          'محطة',
          'fuel',
          'gas',
          'سوبر',
          'سوبرماركت',
          'ماركت',
          'supermarket',
          'atm',
          'صراف',
          'صراف آلي'
        ].includes(text);

      if(!isCategoryWord){

        places =
          places.filter(place =>
            place.name
              .toLowerCase()
              .includes(text)
          );

      }

    }


    /*
     ترتيب من الأقرب للأبعد
    */

    places.sort(
      (a,b) =>
        a.distance-b.distance
    );


    /*
     إزالة التكرار
    */

    const unique=[];

    const seen=new Set();

    for(const place of places){

      const key =
        place.name +
        '|' +
        place.lat.toFixed(5) +
        '|' +
        place.lon.toFixed(5);

      if(!seen.has(key)){

        seen.add(key);
        unique.push(place);

      }

    }


    places =
      unique.slice(0,30);


    renderResults(places);


    if(places.length){

      statusEl.textContent =
        '✅ تم العثور على ' +
        places.length +
        ' مكان قريب';

      countEl.textContent =
        places.length + ' نتيجة';

    }else{

      statusEl.textContent =
        'لم نجد نتائج مناسبة.';

      countEl.textContent =
        'لا نتائج';

      resultsEl.innerHTML =
        `
        <div class="empty">
          😕 ما لقينا أماكن مطابقة.
          <br>
          جرّب فئة ثانية أو كلمة بحث مختلفة.
        </div>
        `;

    }


  }catch(error){

    console.error(
      'Wenah search error:',
      error
    );

    statusEl.textContent =
      '⚠️ تعذر تحميل النتائج حالياً.';

    countEl.textContent='';

    resultsEl.innerHTML =
      `
      <div class="empty">
        ⚠️ صار خطأ أثناء تحميل الأماكن.
        <br>
        جرّب مرة ثانية بعد ثوانٍ.
      </div>
      `;

  }

}


/* =========================
   عرض النتائج
========================= */

function renderResults(places){

  resultsEl.innerHTML='';


  places.forEach(place => {

    const icon =
      getIcon(
        place.name,
        place.type
      );


    const marker =
      L.marker([
        place.lat,
        place.lon
      ])
      .addTo(map)
      .bindPopup(
        `<b>${escapeHtml(place.name)}</b>
         <br>
         ${formatDistance(place.distance)}`
      );


    markers.push(marker);


    const element =
      document.createElement('div');

    element.className='result';


    element.innerHTML=`

      <div class="result-icon">
        ${icon}
      </div>

      <div class="result-info">

        <strong>
          ${escapeHtml(place.name)}
        </strong>

        <small>
          ${getTypeName(place.type)}
          ${place.phone ? ' • '+escapeHtml(place.phone) : ''}
        </small>

      </div>

      <div class="distance">
        ${formatDistance(place.distance)}
      </div>

    `;


    element.onclick=()=>{

      openDetail(
        place,
        marker
      );

    };


    resultsEl.appendChild(element);

  });

}


/* =========================
   أيقونات الأماكن
========================= */

function getIcon(name,type){

  if(type==='restaurant')
    return '🍔';

  if(type==='cafe')
    return '☕';

  if(type==='pharmacy')
    return '💊';

  if(type==='fuel')
    return '⛽';

  if(type==='supermarket')
    return '🛒';

  if(type==='atm')
    return '🏧';

  if(type==='hospital')
    return '🏥';

  return '📍';

}


/* =========================
   أسماء الفئات
========================= */

function getTypeName(type){

  const names={

    restaurant:'مطعم',

    cafe:'كافيه',

    pharmacy:'صيدلية',

    fuel:'محطة بنزين',

    supermarket:'سوبرماركت',

    atm:'صراف آلي',

    hospital:'مستشفى',

    clinic:'عيادة'

  };

  return names[type] || 'مكان قريب';

}


/* =========================
   المسافة
========================= */

function calculateDistance(
  lat1,
  lon1,
  lat2,
  lon2
){

  if(
    !Number.isFinite(lat2) ||
    !Number.isFinite(lon2)
  ){
    return Infinity;
  }


  const R=6371;

  const dLat =
    (lat2-lat1) *
    Math.PI/180;

  const dLon =
    (lon2-lon1) *
    Math.PI/180;


  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)**2;


  return R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );

}


function formatDistance(distance){

  if(distance < 1){

    return Math.round(
      distance*1000
    )+' م';

  }

  return distance.toFixed(1)+' كم';

}


/* =========================
   تفاصيل المكان
========================= */

function openDetail(place,marker){

  selectedPlace=place;

  document.getElementById(
    'detailIcon'
  ).textContent =
    getIcon(
      place.name,
      place.type
    );

  document.getElementById(
    'detailName'
  ).textContent =
    place.name;

  document.getElementById(
    'detailDistance'
  ).textContent =
    formatDistance(
      place.distance
    )+' منك';

  document.getElementById(
    'detailType'
  ).textContent =
    getTypeName(place.type) +
    (place.phone
      ? ' • '+place.phone
      : ''
    );


  const saved =
    isFavorite(place);


  document.getElementById(
    'favoriteButton'
  ).textContent =
    saved
      ? '♥️ محفوظ'
      : '♡ حفظ بالمفضلة';


  document.getElementById(
    'detail'
  ).classList.add('show');


  map.setView(
    [place.lat,place.lon],
    17
  );


  if(marker){
    marker.openPopup();
  }

}


function closeDetail(){

  document
    .getElementById('detail')
    .classList.remove('show');

}


/* =========================
   الاتجاهات
========================= */

function openDirections(){

  if(
    !selectedPlace ||
    !userLocation
  ){

    toast(
      '📍 حدد موقعك أولاً'
    );

    return;
  }


  const url =
    'https://www.google.com/maps/dir/?api=1' +
    '&origin=' +
    userLocation[0] +
    ',' +
    userLocation[1] +
    '&destination=' +
    selectedPlace.lat +
    ',' +
    selectedPlace.lon;


  window.open(
    url,
    '_blank'
  );

}


/* =========================
   المفضلة
========================= */

function isFavorite(place){

  return favorites.some(
    item =>
      item.name===place.name &&
      Math.abs(
        item.lat-place.lat
      ) < .0001 &&
      Math.abs(
        item.lon-place.lon
      ) < .0001
  );

}


function toggleFavorite(){

  if(!selectedPlace)
    return;


  const index =
    favorites.findIndex(
      item =>
        item.name===selectedPlace.name &&
        Math.abs(
          item.lat-selectedPlace.lat
        ) < .0001 &&
        Math.abs(
          item.lon-selectedPlace.lon
        ) < .0001
    );


  if(index>=0){

    favorites.splice(
      index,
      1
    );

    toast(
      'تمت إزالة المكان من المفضلة'
    );

  }else{

    favorites.push(
      selectedPlace
    );

    toast(
      '❤️ تمت إضافة المكان للمفضلة'
    );

  }


  localStorage.setItem(
    'wenahFavorites',
    JSON.stringify(favorites)
  );


  openDetail(
    selectedPlace
  );

}


/* =========================
   عرض المفضلة
========================= */

function showFavorites(){

  closeDetail();

  if(!favorites.length){

    toast(
      '❤️ المفضلة فاضية حالياً'
    );

    return;
  }


  clearMarkers();

  resultsEl.innerHTML='';


  countEl.textContent =
    favorites.length+' محفوظ';


  statusEl.textContent =
    '❤️ الأماكن المحفوظة';


  favorites.forEach(place => {

    const element =
      document.createElement('div');

    element.className='result';


    element.innerHTML=`

      <div class="result-icon">
        ${getIcon(
          place.name,
          place.type
        )}
      </div>

      <div class="result-info">

        <strong>
          ${escapeHtml(place.name)}
        </strong>

        <small>
          ${getTypeName(place.type)}
        </small>

      </div>

      <div class="distance">
        ♥️
      </div>

    `;


    element.onclick=()=>{

      const marker =
        L.marker([
          place.lat,
          place.lon
        ])
        .addTo(map);

      markers.push(marker);

      openDetail(
        place,
        marker
      );

    };


    resultsEl.appendChild(element);

  });


  document
    .querySelector('.section-head')
    .scrollIntoView({
      behavior:'smooth'
    });

}


/* =========================
   رسالة صغيرة
========================= */

function toast(message){

  const element =
    document.getElementById(
      'toast'
    );

  element.textContent=message;

  element.classList.add('show');

  setTimeout(
    () =>
      element.classList.remove('show'),
    1800
  );

}


/* =========================
   حماية أسماء الأماكن
========================= */

function escapeHtml(text){

  return String(text)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");

}
