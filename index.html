<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071d19">

  <title>Wenah | وينه؟</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 90% 0%, #0d5a45 0%, transparent 32%),
        #061b17;
      color: #f4fffb;
    }

    .app {
      max-width: 760px;
      margin: auto;
      padding: 18px 16px 35px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 23px;
      font-weight: 900;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, #29efaa, #078d68);
      font-size: 22px;
    }

    .near {
      color: #5ff0ba;
      background: rgba(33,230,160,.08);
      border: 1px solid rgba(33,230,160,.2);
      border-radius: 999px;
      padding: 8px 11px;
      font-size: 11px;
      font-weight: 800;
    }

    .hero {
      padding: 30px 0 15px;
    }

    .eyebrow {
      color: #21e6a0;
      font-weight: 900;
      font-size: 14px;
    }

    h1 {
      font-size: clamp(40px, 10vw, 58px);
      line-height: 1;
      margin: 9px 0 14px;
    }

    h1 span {
      color: #21e6a0;
    }

    .hero p {
      color: #9db9b1;
      line-height: 1.8;
      margin: 0 0 20px;
      font-size: 14px;
    }

    .search {
      display: flex;
      gap: 8px;
      padding: 7px;
      background: #0a2721;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 17px;
    }

    .search input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      padding: 11px;
      font-size: 15px;
    }

    .search button {
      border: 0;
      border-radius: 13px;
      background: #21e6a0;
      color: #05281f;
      font-weight: 900;
      padding: 11px 17px;
      cursor: pointer;
    }

    .location {
      width: 100%;
      margin: 10px 0 15px;
      padding: 14px;
      border: 0;
      border-radius: 15px;
      background: #10372f;
      color: #eafff8;
      font-weight: 900;
      cursor: pointer;
    }

    .status {
      min-height: 22px;
      text-align: center;
      color: #9db9b1;
      font-size: 12px;
      margin: 6px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 5px 0 16px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,.08);
      background: #0b2721;
      color: #e5f7f2;
      border-radius: 999px;
      padding: 9px 14px;
      cursor: pointer;
      font-weight: 700;
    }

    .category.active {
      background: #21e6a0;
      color: #05281f;
      border-color: #21e6a0;
    }

    #map {
      height: 330px;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 22px 0 10px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 19px;
    }

    .count {
      color: #718e86;
      font-size: 11px;
    }

    .results {
      display: grid;
      gap: 9px;
    }

    .result {
      display: flex;
      align-items: center;
      gap: 11px;
      background: linear-gradient(145deg,#103129,#0a241f);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 17px;
      padding: 12px;
      cursor: pointer;
    }

    .result-icon {
      width: 50px;
      height: 50px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #15382f;
      font-size: 23px;
    }

    .result-info {
      min-width: 0;
      flex: 1;
    }

    .result-info strong {
      display: block;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-info small {
      display: block;
      color: #8fa9a1;
      margin-top: 4px;
      font-size: 11px;
    }

    .distance {
      color: #21e6a0;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .empty {
      padding: 28px 15px;
      text-align: center;
      color: #8da9a1;
      background: #0b2721;
      border-radius: 17px;
      font-size: 13px;
    }

    .detail {
      display: none;
      margin-top: 12px;
      padding: 16px;
      background: #0b2721;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
    }

    .detail.show {
      display: block;
    }

    .detail-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .detail-icon {
      font-size: 30px;
    }

    .detail h3 {
      margin: 5px 0;
      font-size: 20px;
    }

    .detail p {
      color: #91aca4;
      font-size: 12px;
      line-height: 1.7;
    }

    .close {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 12px;
      background: #ffffff10;
      color: white;
      cursor: pointer;
    }

    .detail-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .detail-actions button {
      border: 0;
      border-radius: 13px;
      padding: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .directions {
      background: #21e6a0;
      color: #05281f;
    }

    .save {
      background: #15382f;
      color: white;
    }

    footer {
      text-align: center;
      color: #607e76;
      font-size: 11px;
      padding: 25px 0 10px;
    }

    @media (max-width: 450px) {
      #map {
        height: 300px;
      }

      .hero {
        padding-top: 24px;
      }

      .detail-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<main class="app">

  <header>
    <div class="logo">
      <div class="logo-icon">📍</div>
      Wenah <span style="color:#21e6a0">| وينه؟</span>
    </div>

    <div class="near">● قريب منك</div>
  </header>

  <section class="hero">

    <div class="eyebrow">كل شيء قريب منك.</div>

    <h1>
      وينه؟ <span>لقيته.</span>
    </h1>

    <p>
      حدد موقعك وابحث عن المكان الذي تريده.
      Wenah يعرض لك الأماكن القريبة منك حسب الفئة.
    </p>

    <div class="search">
      <input
        id="searchInput"
        type="text"
        placeholder="مثلاً: مطاعم، كافيهات، صيدليات..."
        onkeydown="if(event.key==='Enter') searchPlaces()"
      >

      <button onclick="searchPlaces()">بحث</button>
    </div>

    <button class="location" onclick="getLocation()">
      📍 استخدم موقعي
    </button>

    <div id="status" class="status"></div>

  </section>

  <div class="categories">

    <button class="category active" data-type="" onclick="chooseCategory(this,'')">
      الكل
    </button>

    <button class="category" data-type="restaurant" onclick="chooseCategory(this,'restaurant')">
      🍔 مطاعم
    </button>

    <button class="category" data-type="cafe" onclick="chooseCategory(this,'cafe')">
      ☕ كافيهات
    </button>

    <button class="category" data-type="pharmacy" onclick="chooseCategory(this,'pharmacy')">
      💊 صيدليات
    </button>

    <button class="category" data-type="fuel" onclick="chooseCategory(this,'fuel')">
      ⛽ بنزين
    </button>

    <button class="category" data-type="supermarket" onclick="chooseCategory(this,'supermarket')">
      🛒 سوبرماركت
    </button>

    <button class="category" data-type="atm" onclick="chooseCategory(this,'atm')">
      🏧 ATM
    </button>

  </div>

  <div id="map"></div>

  <div class="section-title">
    <h2>الأماكن القريبة</h2>
    <span id="count" class="count">حدد موقعك أولاً</span>
  </div>

  <div id="results" class="results">
    <div class="empty">
      📍 اضغط «استخدم موقعي» حتى نعرض الأماكن حولك.
    </div>
  </div>

  <div id="detail" class="detail">

    <div class="detail-top">

      <div>
        <div id="detailIcon" class="detail-icon">📍</div>
        <h3 id="detailName"></h3>
        <p id="detailType"></p>
        <strong id="detailDistance" style="color:#21e6a0"></strong>
      </div>

      <button class="close" onclick="closeDetail()">✕</button>

    </div>

    <div class="detail-actions">

      <button class="directions" onclick="openDirections()">
        🧭 الاتجاهات
      </button>

      <button class="save" onclick="savePlace()">
        ♡ حفظ
      </button>

    </div>

  </div>

  <footer>
    Wenah — وينه؟ • اكتشف أقرب مكان بسهولة.
  </footer>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map = L.map("map").setView([31.95, 35.91], 12);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "© OpenStreetMap"
  }
).addTo(map);

let userLocation = null;
let markers = [];
let currentCategory = "";
let selectedPlace = null;

const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");
const countEl = document.getElementById("count");

function setStatus(text) {
  statusEl.textContent = text;
}

function getLocation() {

  if (!navigator.geolocation) {
    setStatus("❌ المتصفح لا يدعم تحديد الموقع.");
    return;
  }

  setStatus("📍 جاري تحديد موقعك...");

  navigator.geolocation.getCurrentPosition(

    function(position) {

      userLocation = {
        lat: position.coords.latitude,
        lon: position.coords.longitude
      };

      map.setView(
        [userLocation.lat, userLocation.lon],
        15
      );

      L.circleMarker(
        [userLocation.lat, userLocation.lon],
        {
          radius: 9,
          color: "#071d19",
          weight: 4,
          fillColor: "#21e6a0",
          fillOpacity: 1
        }
      )
      .addTo(map)
      .bindPopup("📍 موقعك")
      .openPopup();

      setStatus("✅ تم تحديد موقعك");

      loadPlaces();

    },

    function() {
      setStatus(
        "❌ اسمح للموقع من إعدادات Edge ثم حاول مرة ثانية."
      );
    },

    {
      enableHighAccuracy: true,
      timeout: 15000
    }

  );
}

function chooseCategory(button, category) {

  document
    .querySelectorAll(".category")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  currentCategory = category;

  if (!userLocation) {
    getLocation();
    return;
  }

  loadPlaces();
}

function searchPlaces() {

  const input =
    document.getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  if (input.includes("مطعم") || input.includes("برغر") || input.includes("burger")) {
    currentCategory = "restaurant";
  }

  else if (
    input.includes("كافيه") ||
    input.includes("قهوة") ||
    input.includes("coffee")
  ) {
    currentCategory = "cafe";
  }

  else if (
    input.includes("صيدلية") ||
    input.includes("صيدليات") ||
    input.includes("pharmacy")
  ) {
    currentCategory = "pharmacy";
  }

  else if (
    input.includes("بنزين") ||
    input.includes("محطة") ||
    input.includes("fuel")
  ) {
    currentCategory = "fuel";
  }

  else if (
    input.includes("سوبر") ||
    input.includes("ماركت") ||
    input.includes("supermarket")
  ) {
    currentCategory = "supermarket";
  }

  else if (
    input.includes("atm") ||
    input.includes("صراف")
  ) {
    currentCategory = "atm";
  }

  if (!userLocation) {
    getLocation();
    return;
  }

  loadPlaces();
}

function getOverpassTag() {

  switch (currentCategory) {

    case "restaurant":
      return '[amenity="restaurant"]';

    case "cafe":
      return '[amenity="cafe"]';

    case "pharmacy":
      return '[amenity="pharmacy"]';

    case "fuel":
      return '[amenity="fuel"]';

    case "supermarket":
      return '[shop="supermarket"]';

    case "atm":
      return '[amenity="atm"]';

    default:
      return '["name"]';
  }
}

async function loadPlaces() {

  if (!userLocation) {
    return;
  }

  setStatus("🔎 جاري البحث عن الأماكن القريبة...");

  resultsEl.innerHTML =
    '<div class="empty">جاري البحث...</div>';

  clearMarkers();

  const tag = getOverpassTag();

  const lat = userLocation.lat;
  const lon = userLocation.lon;

  const query = `
    [out:json][timeout:25];

    (
      nwr(
        around:5000,
        ${lat},
        ${lon}
      )
      ${tag};
    );

    out center tags;
  `;

  const endpoints = [
    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter"
  ];

  let data = null;

  for (const endpoint of endpoints) {

    try {

      const response = await fetch(
        endpoint + "?data=" + encodeURIComponent(query)
      );

      if (!response.ok) {
        continue;
      }

      data = await response.json();

      break;

    } catch (error) {
      console.log(error);
    }
  }

  if (!data) {

    setStatus("❌ تعذر تحميل الأماكن حالياً.");

    resultsEl.innerHTML =
      '<div class="empty">⚠️ حاول مرة ثانية بعد قليل.</div>';

    return;
  }

  const places =
    (data.elements || [])
      .map(item => {

        const lat =
          item.lat ??
          item.center?.lat;

        const lon =
          item.lon ??
          item.center?.lon;

        const tags = item.tags || {};

        return {

          lat,
          lon,

          name:
            tags["name:ar"] ||
            tags.name ||
            tags["name:en"] ||
            "مكان بدون اسم",

          type:
            currentCategory,

          phone:
            tags.phone || "",

          distance:
            calculateDistance(
              userLocation.lat,
              userLocation.lon,
              lat,
              lon
            )

        };

      })

      .filter(place =>
        Number.isFinite(place.lat) &&
        Number.isFinite(place.lon)
      )

      .sort(
        (a,b) =>
          a.distance - b.distance
      )

      .slice(0,20);

  renderPlaces(places);

  countEl.textContent =
    places.length
      ? `${places.length} نتيجة`
      : "لا نتائج";

  setStatus(
    places.length
      ? "✅ تم العثور على الأماكن القريبة"
      : "لم نجد نتائج ضمن 5 كم."
  );
}

function calculateDistance(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371;

  const dLat =
    (lat2-lat1) *
    Math.PI / 180;

  const dLon =
    (lon2-lon1) *
    Math.PI / 180;

  const a =
    Math.sin(dLat/2) ** 2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2) ** 2;

  return R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );
}

function iconFor(type) {

  switch(type) {

    case "restaurant":
      return "🍔";

    case "cafe":
      return "☕";

    case "pharmacy":
      return "💊";

    case "fuel":
      return "⛽";

    case "supermarket":
      return "🛒";

    case "atm":
      return "🏧";

    default:
      return "📍";
  }
}

function clearMarkers() {

  markers.forEach(marker =>
    map.removeLayer(marker)
  );

  markers = [];
}

function renderPlaces(places) {

  resultsEl.innerHTML = "";

  if (!places.length) {

    resultsEl.innerHTML =
      '<div class="empty">لم نجد أماكن بهذه الفئة قريبة منك.</div>';

    return;
  }

  places.forEach(place => {

    const marker =
      L.marker([
        place.lat,
        place.lon
      ])
      .addTo(map)
      .bindPopup(
        `<b>${escapeHtml(place.name)}</b><br>
         ${formatDistance(place.distance)}`
      );

    markers.push(marker);

    const item =
      document.createElement("div");

    item.className = "result";

    item.innerHTML = `

      <div class="result-icon">
        ${iconFor(place.type)}
      </div>

      <div class="result-info">

        <strong>
          ${escapeHtml(place.name)}
        </strong>

        <small>
          ${categoryName(place.type)}
          ${place.phone ? " • " + escapeHtml(place.phone) : ""}
        </small>

      </div>

      <div class="distance">
        ${formatDistance(place.distance)}
      </div>

    `;

    item.onclick = () =>
      showDetail(place, marker);

    resultsEl.appendChild(item);

  });
}

function categoryName(type) {

  const names = {

    restaurant: "مطعم",

    cafe: "كافيه",

    pharmacy: "صيدلية",

    fuel: "محطة بنزين",

    supermarket: "سوبرماركت",

    atm: "صراف آلي"

  };

  return names[type] || "مكان قريب";
}

function formatDistance(distance) {

  if (distance < 1) {
    return Math.round(distance * 1000) + " م";
  }

  return distance.toFixed(1) + " كم";
}

function showDetail(place, marker) {

  selectedPlace = place;

  document.getElementById("detailIcon")
    .textContent =
    iconFor(place.type);

  document.getElementById("detailName")
    .textContent =
    place.name;

  document.getElementById("detailType")
    .textContent =
    categoryName(place.type) +
    (place.phone
      ? " • " + place.phone
      : "");

  document.getElementById("detailDistance")
    .textContent =
    formatDistance(place.distance) +
    " منك";

  document.getElementById("detail")
    .classList.add("show");

  map.setView(
    [place.lat, place.lon],
    17
  );

  marker.openPopup();
}

function closeDetail() {

  document.getElementById("detail")
    .classList.remove("show");

  selectedPlace = null;
}

function openDirections() {

  if (!selectedPlace || !userLocation) {
    return;
  }

  const url =
    `https://www.google.com/maps/dir/?api=1` +
    `&origin=${userLocation.lat},${userLocation.lon}` +
    `&destination=${selectedPlace.lat},${selectedPlace.lon}`;

  window.open(
    url,
    "_blank"
  );
}

function savePlace() {

  if (!selectedPlace) {
    return;
  }

  let saved =
    JSON.parse(
      localStorage.getItem("wenahSaved") || "[]"
    );

  const exists =
    saved.some(place =>
      place.name === selectedPlace.name &&
      Math.abs(place.lat - selectedPlace.lat) < 0.0001
    );

  if (exists) {

    saved =
      saved.filter(place =>
        !(
          place.name === selectedPlace.name &&
          Math.abs(place.lat - selectedPlace.lat) < 0.0001
        )
      );

    localStorage.setItem(
      "wenahSaved",
      JSON.stringify(saved)
    );

    alert("تمت إزالة المكان من المفضلة ❤️");

  } else {

    saved.push(selectedPlace);

    localStorage.setItem(
      "wenahSaved",
      JSON.stringify(saved)
    );

    alert("تم حفظ المكان بالمفضلة ❤️");
  }
}

function escapeHtml(text) {

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

</script>

</body>
</html>
