<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061b17">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Wenah | وينه؟</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 85% -5%, rgba(19,126,91,.42), transparent 30%),
        radial-gradient(circle at 0% 30%, rgba(11,81,65,.22), transparent 28%),
        #061b17;
      color: #f4fffb;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: auto;
      padding: 18px 16px 38px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 21px;
      font-weight: 900;
      letter-spacing: -.4px;
    }

    .logo-icon {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: linear-gradient(135deg,#32f4b0,#078b68);
      box-shadow: 0 8px 25px rgba(33,230,160,.16);
      font-size: 21px;
    }

    .near {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #5ff0ba;
      background: rgba(33,230,160,.07);
      border: 1px solid rgba(33,230,160,.18);
      border-radius: 999px;
      padding: 8px 11px;
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }

    .near-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #21e6a0;
      box-shadow: 0 0 10px #21e6a0;
    }

    .hero {
      padding: 34px 0 18px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #21e6a0;
      font-weight: 900;
      font-size: 13px;
    }

    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #21e6a0;
      box-shadow: 0 0 12px #21e6a0;
    }

    h1 {
      font-size: clamp(42px,11vw,62px);
      line-height: .98;
      letter-spacing: -2px;
      margin: 10px 0 15px;
    }

    h1 span {
      color: #21e6a0;
    }

    .hero p {
      color: #96b4ab;
      line-height: 1.8;
      margin: 0 0 21px;
      font-size: 14px;
      max-width: 560px;
    }

    .search {
      display: flex;
      gap: 7px;
      padding: 7px;
      background: rgba(10,39,33,.92);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      box-shadow: 0 14px 35px rgba(0,0,0,.16);
    }

    .search:focus-within {
      border-color: rgba(33,230,160,.35);
      box-shadow: 0 0 0 3px rgba(33,230,160,.06);
    }

    .search-icon {
      width: 40px;
      display: grid;
      place-items: center;
      color: #6d9288;
      font-size: 17px;
    }

    .search input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      padding: 10px 2px;
      font-size: 14px;
    }

    .search input::placeholder {
      color: #66857c;
    }

    .search button {
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg,#2bf0aa,#18d99a);
      color: #05281f;
      font-weight: 900;
      padding: 10px 17px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(33,230,160,.12);
    }

    .search button:active {
      transform: scale(.97);
    }

    .location {
      width: 100%;
      margin: 10px 0 8px;
      padding: 14px;
      border: 1px solid rgba(33,230,160,.12);
      border-radius: 16px;
      background: linear-gradient(135deg,#103b31,#0c2c25);
      color: #eafff8;
      font-weight: 900;
      cursor: pointer;
    }

    .location:active {
      transform: scale(.99);
    }

    .status {
      min-height: 22px;
      text-align: center;
      color: #8daaa2;
      font-size: 11px;
      margin: 7px 4px;
    }

    .categories-wrap {
      position: relative;
      margin-bottom: 13px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 1px 8px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(11,39,33,.92);
      color: #e5f7f2;
      border-radius: 999px;
      padding: 9px 14px;
      cursor: pointer;
      font-weight: 800;
      font-size: 12px;
      transition: .18s ease;
    }

    .category:active {
      transform: scale(.96);
    }

    .category.active {
      background: #21e6a0;
      color: #05281f;
      border-color: #21e6a0;
      box-shadow: 0 7px 20px rgba(33,230,160,.12);
    }

    .map-card {
      position: relative;
      overflow: hidden;
      border-radius: 23px;
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 20px 60px rgba(0,0,0,.32);
    }

    #map {
      height: 340px;
      width: 100%;
    }

    .map-label {
      position: absolute;
      z-index: 500;
      top: 12px;
      right: 12px;
      background: rgba(6,27,23,.88);
      backdrop-filter: blur(10px);
      color: #eafff8;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 10px;
      font-weight: 900;
      pointer-events: none;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 23px 0 10px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 19px;
      letter-spacing: -.3px;
    }

    .count {
      color: #718e86;
      font-size: 11px;
    }

    .results {
      display: grid;
      gap: 9px;
    }

    .result {
      display: flex;
      align-items: center;
      gap: 11px;
      background: linear-gradient(145deg,#103129,#0a241f);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 18px;
      padding: 12px;
      cursor: pointer;
      transition: transform .16s ease,border-color .16s ease;
    }

    .result:hover {
      border-color: rgba(33,230,160,.22);
    }

    .result:active {
      transform: scale(.985);
    }

    .result-icon {
      width: 50px;
      height: 50px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: #15382f;
      font-size: 22px;
    }

    .result-info {
      min-width: 0;
      flex: 1;
    }

    .result-info strong {
      display: block;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-info small {
      display: block;
      color: #8fa9a1;
      margin-top: 4px;
      font-size: 10px;
    }

    .distance {
      color: #21e6a0;
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }

    .empty {
      padding: 28px 15px;
      text-align: center;
      color: #8da9a1;
      background: #0b2721;
      border: 1px solid rgba(255,255,255,.05);
      border-radius: 18px;
      font-size: 12px;
    }

    .detail {
      display: none;
      margin-top: 12px;
      padding: 16px;
      background: linear-gradient(145deg,#0e3028,#09231e);
      border: 1px solid rgba(33,230,160,.12);
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,.2);
    }

    .detail.show {
      display: block;
      animation: detailIn .2s ease;
    }

    @keyframes detailIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .detail-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .detail-icon {
      font-size: 30px;
    }

    .detail h3 {
      margin: 5px 0;
      font-size: 20px;
    }

    .detail p {
      color: #91aca4;
      font-size: 12px;
      line-height: 1.7;
      margin: 4px 0;
    }

    .close {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 12px;
      background: #ffffff10;
      color: white;
      cursor: pointer;
    }

    .detail-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .detail-actions button {
      border: 0;
      border-radius: 13px;
      padding: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .directions {
      background: #21e6a0;
      color: #05281f;
    }

    .save {
      background: #15382f;
      color: white;
    }

    footer {
      text-align: center;
      color: #607e76;
      font-size: 10px;
      padding: 28px 0 8px;
    }

    .leaflet-control-zoom a {
      background: #09251f !important;
      color: #dffcf3 !important;
      border-color: rgba(255,255,255,.1) !important;
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: #0b2721;
      color: white;
    }

    .leaflet-popup-content {
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    }

    @media (max-width:450px) {

      .app {
        padding: 15px 13px 30px;
      }

      .logo {
        font-size: 19px;
      }

      .logo-icon {
        width: 40px;
        height: 40px;
      }

      .near {
        padding: 7px 9px;
      }

      .hero {
        padding-top: 28px;
      }

      h1 {
        font-size: 45px;
      }

      #map {
        height: 305px;
      }

      .detail-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<main class="app">

  <header>

    <div class="logo">

      <div class="logo-icon">📍</div>

      <span>
        Wenah
        <span style="color:#21e6a0">| وينه؟</span>
      </span>

    </div>

    <div class="near">
      <span class="near-dot"></span>
      قريب منك
    </div>

  </header>

  <section class="hero">

    <div class="eyebrow">
      كل شيء قريب منك
    </div>

    <h1>
      وينه؟ <span>لقيته.</span>
    </h1>

    <p>
      حدد موقعك وابحث عن المكان الذي تريده.
      Wenah يساعدك تكتشف أقرب الأماكن حولك بسهولة.
    </p>

    <div class="search">

      <div class="search-icon">⌕</div>

      <input
        id="searchInput"
        type="text"
        autocomplete="off"
        placeholder="مثلاً: مطاعم، كافيهات، صيدليات..."
        onkeydown="if(event.key==='Enter') searchPlaces()"
      >

      <button onclick="searchPlaces()">
        بحث
      </button>

    </div>

    <button class="location" onclick="getLocation()">
      📍 استخدم موقعي
    </button>

    <div id="status" class="status"></div>

  </section>

  <div class="categories-wrap">

    <div class="categories">

      <button
        class="category active"
        data-type=""
        onclick="chooseCategory(this,'')">
        الكل
      </button>

      <button
        class="category"
        data-type="restaurant"
        onclick="chooseCategory(this,'restaurant')">
        🍔 مطاعم
      </button>

      <button
        class="category"
        data-type="cafe"
        onclick="chooseCategory(this,'cafe')">
        ☕ كافيهات
      </button>

      <button
        class="category"
        data-type="pharmacy"
        onclick="chooseCategory(this,'pharmacy')">
        💊 صيدليات
      </button>

      <button
        class="category"
        data-type="fuel"
        onclick="chooseCategory(this,'fuel')">
        ⛽ بنزين
      </button>

      <button
        class="category"
        data-type="supermarket"
        onclick="chooseCategory(this,'supermarket')">
        🛒 سوبرماركت
      </button>

      <button
        class="category"
        data-type="atm"
        onclick="chooseCategory(this,'atm')">
        🏧 ATM
      </button>

    </div>

  </div>

  <div class="map-card">

    <div id="map"></div>

    <div class="map-label">
      🗺️ خريطة الأماكن
    </div>

  </div>

  <div class="section-title">

    <h2>
      الأماكن القريبة
    </h2>

    <span id="count" class="count">
      حدد موقعك أولاً
    </span>

  </div>

  <div id="results" class="results">

    <div class="empty">
      📍 اضغط «استخدم موقعي» حتى نعرض الأماكن حولك.
    </div>

  </div>

  <div id="detail" class="detail">

    <div class="detail-top">

      <div>

        <div id="detailIcon" class="detail-icon">
          📍
        </div>

        <h3 id="detailName"></h3>

        <p id="detailType"></p>

        <strong
          id="detailDistance"
          style="color:#21e6a0">
        </strong>

      </div>

      <button
        class="close"
        onclick="closeDetail()">
        ✕
      </button>

    </div>

    <div class="detail-actions">

      <button
        class="directions"
        onclick="openDirections()">
        🧭 الاتجاهات
      </button>

      <button
        class="save"
        onclick="savePlace()">
        ♡ حفظ
      </button>

    </div>

  </div>

  <footer>
    Wenah — وينه؟ • اكتشف أقرب مكان بسهولة.
  </footer>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map =
  L.map("map")
   .setView([31.95,35.91],12);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"©️ OpenStreetMap"
  }
).addTo(map);

let userLocation = null;
let markers = [];
let userMarker = null;
let currentCategory = "";
let selectedPlace = null;

const statusEl =
  document.getElementById("status");

const resultsEl =
  document.getElementById("results");

const countEl =
  document.getElementById("count");


function setStatus(text) {
  statusEl.textContent = text;
}


function getLocation() {

  if (!navigator.geolocation) {

    setStatus(
      "❌ المتصفح لا يدعم تحديد الموقع."
    );

    return;
  }

  setStatus(
    "📍 جاري تحديد موقعك..."
  );

  navigator.geolocation.getCurrentPosition(

    function(position) {

      userLocation = {
        lat: position.coords.latitude,
        lon: position.coords.longitude
      };

      map.setView(
        [
          userLocation.lat,
          userLocation.lon
        ],
        15
      );

      if (userMarker) {
        map.removeLayer(userMarker);
      }

      userMarker =
        L.circleMarker(
          [
            userLocation.lat,
            userLocation.lon
          ],
          {
            radius:9,
            color:"#071d19",
            weight:4,
            fillColor:"#21e6a0",
            fillOpacity:1
          }
        )
        .addTo(map)
        .bindPopup("📍 موقعك");

      setStatus(
        "✅ تم تحديد موقعك"
      );

      loadPlaces();

    },

    function() {

      setStatus(
        "❌ اسمح للموقع من إعدادات Edge ثم حاول مرة ثانية."
      );

    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:60000
    }

  );
}


function chooseCategory(
  button,
  category
) {

  document
    .querySelectorAll(".category")
    .forEach(
      btn =>
        btn.classList.remove("active")
    );

  button.classList.add("active");

  currentCategory = category;

  if (!userLocation) {
    getLocation();
    return;
  }

  loadPlaces();
}


function updateActiveCategory() {

  document
    .querySelectorAll(".category")
    .forEach(btn => {

      btn.classList.toggle(
        "active",
        btn.dataset.type === currentCategory
      );

    });

}


function searchPlaces() {

  const input =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  if (
    input.includes("مطعم") ||
    input.includes("مطاعم") ||
    input.includes("برغر") ||
    input.includes("برجر") ||
    input.includes("burger") ||
    input.includes("restaurant")
  ) {

    currentCategory =
      "restaurant";

  }

  else if (
    input.includes("كافيه") ||
    input.includes("كافيهات") ||
    input.includes("قهوة") ||
    input.includes("كوفي") ||
    input.includes("coffee") ||
    input.includes("cafe")
  ) {

    currentCategory =
      "cafe";

  }

  else if (
    input.includes("صيدلية") ||
    input.includes("صيدليات") ||
    input.includes("pharmacy")
  ) {

    currentCategory =
      "pharmacy";

  }

  else if (
    input.includes("بنزين") ||
    input.includes("محطة") ||
    input.includes("محطات") ||
    input.includes("fuel") ||
    input.includes("gas")
  ) {

    currentCategory =
      "fuel";

  }

  else if (
    input.includes("سوبر") ||
    input.includes("ماركت") ||
    input.includes("سوبرماركت") ||
    input.includes("supermarket")
  ) {

    currentCategory =
      "supermarket";

  }

  else if (
    input.includes("atm") ||
    input.includes("صراف") ||
    input.includes("صراف آلي")
  ) {

    currentCategory =
      "atm";

  }

  updateActiveCategory();

  if (!userLocation) {
    getLocation();
    return;
  }

  loadPlaces();
}


function getOverpassTag() {

  switch(currentCategory) {

    case "restaurant":
      return '[amenity="restaurant"]';

    case "cafe":
      return '[amenity="cafe"]';

    case "pharmacy":
      return '[amenity="pharmacy"]';

    case "fuel":
      return '[amenity="fuel"]';

    case "supermarket":
      return '[shop="supermarket"]';

    case "atm":
      return '[amenity="atm"]';

    default:
      return '["name"]';
  }

}


async function loadPlaces() {

  if (!userLocation) {
    return;
  }

  setStatus(
    "🔎 جاري البحث عن الأماكن القريبة..."
  );

  resultsEl.innerHTML =
    '<div class="empty">جاري البحث...</div>';

  clearMarkers();

  const tag =
    getOverpassTag();

  const lat =
    userLocation.lat;

  const lon =
    userLocation.lon;

  const query = `
    [out:json][timeout:25];

    (
      nwr(
        around:5000,
        ${lat},
        ${lon}
      )
      ${tag};
    );

    out center tags;
  `;

  const endpoints = [

    "https://overpass-api.de/api/interpreter",

    "https://overpass.kumi.systems/api/interpreter"

  ];

  let data = null;

  for (
    const endpoint of endpoints
  ) {

    try {

      const response =
        await fetch(
          endpoint +
          "?data=" +
          encodeURIComponent(query)
        );

      if (!response.ok) {
        continue;
      }

      data =
        await response.json();

      break;

    }

    catch(error) {

      console.log(error);

    }

  }

  if (!data) {

    setStatus(
      "❌ تعذر تحميل الأماكن حالياً."
    );

    resultsEl.innerHTML =
      '<div class="empty">⚠️ حاول مرة ثانية بعد قليل.</div>';

    return;
  }

  const places =
    (data.elements || [])

      .map(item => {

        const lat =
          item.lat ??
          item.center?.lat;

        const lon =
          item.lon ??
          item.center?.lon;

        const tags =
          item.tags || {};

        return {

          lat,
          lon,

          name:
            tags["name:ar"] ||
            tags.name ||
            tags["name:en"] ||
            "مكان بدون اسم",

          type:
            currentCategory,

          phone:
            tags.phone ||
            tags["contact:phone"] ||
            "",

          distance:
            calculateDistance(
              userLocation.lat,
              userLocation.lon,
              lat,
              lon
            )

        };

      })

      .filter(place =>
        Number.isFinite(place.lat) &&
        Number.isFinite(place.lon)
      )

      .sort(
        (a,b) =>
          a.distance -
          b.distance
      )

      .slice(0,20);

  renderPlaces(places);

  countEl.textContent =
    places.length
      ? `${places.length} نتيجة`
      : "لا نتائج";

  setStatus(
    places.length
      ? "✅ تم العثور على الأماكن القريبة"
      : "لم نجد نتائج ضمن 5 كم."
  );

}


function calculateDistance(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371;

  const dLat =
    (lat2-lat1) *
    Math.PI / 180;

  const dLon =
    (lon2-lon1) *
    Math.PI / 180;

  const a =
    Math.sin(dLat/2) ** 2 +
    Math.cos(
      lat1 *
      Math.PI / 180
    ) *
    Math.cos(
      lat2 *
      Math.PI / 180
    ) *
    Math.sin(dLon/2) ** 2;

  return R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );

}


function iconFor(type) {

  switch(type) {

    case "restaurant":
      return "🍔";

    case "cafe":
      return "☕";

    case "pharmacy":
      return "💊";

    case "fuel":
      return "⛽";

    case "supermarket":
      return "🛒";

    case "atm":
      return "🏧";

    default:
      return "📍";

  }

}


function clearMarkers() {

  markers.forEach(
    marker =>
      map.removeLayer(marker)
  );

  markers = [];

}


function renderPlaces(places) {

  resultsEl.innerHTML = "";

  if (!places.length) {

    resultsEl.innerHTML =
      '<div class="empty">لم نجد أماكن بهذه الفئة قريبة منك.</div>';

    return;
  }

  places.forEach(place => {

    const marker =
      L.marker([
        place.lat,
        place.lon
      ])
      .addTo(map)
      .bindPopup(
        `<b>${escapeHtml(place.name)}</b><br>
         ${formatDistance(place.distance)}`
      );

    markers.push(marker);

    const item =
      document.createElement("div");

    item.className =
      "result";

    item.innerHTML = `

      <div class="result-icon">
        ${iconFor(place.type)}
      </div>

      <div class="result-info">

        <strong>
          ${escapeHtml(place.name)}
        </strong>

        <small>
          ${categoryName(place.type)}
          ${
            place.phone
              ? " • " +
                escapeHtml(place.phone)
              : ""
          }
        </small>

      </div>

      <div class="distance">
        ${formatDistance(place.distance)}
      </div>

    `;

    item.onclick =
      () =>
        showDetail(
          place,
          marker
        );

    resultsEl.appendChild(item);

  });

}


function categoryName(type) {

  const names = {

    restaurant:"مطعم",

    cafe:"كافيه",

    pharmacy:"صيدلية",

    fuel:"محطة بنزين",

    supermarket:"سوبرماركت",

    atm:"صراف آلي"

  };

  return names[type] ||
    "مكان قريب";

}


function formatDistance(distance) {

  if (distance < 1) {

    return Math.round(
      distance * 1000
    ) + " م";

  }

  return distance.toFixed(1) +
    " كم";

}


function showDetail(
  place,
  marker
) {

  selectedPlace =
    place;

  document
    .getElementById("detailIcon")
    .textContent =
    iconFor(place.type);

  document
    .getElementById("detailName")
    .textContent =
    place.name;

  document
    .getElementById("detailType")
    .textContent =
    categoryName(place.type) +
    (
      place.phone
        ? " • " +
          place.phone
        : ""
    );

  document
    .getElementById("detailDistance")
    .textContent =
    formatDistance(
      place.distance
    ) +
    " منك";

  document
    .getElementById("detail")
    .classList.add("show");

  map.setView(
    [
      place.lat,
      place.lon
    ],
    17
  );

  marker.openPopup();

}


function closeDetail() {

  document
    .getElementById("detail")
    .classList.remove("show");

  selectedPlace = null;

}


function openDirections() {

  if (
    !selectedPlace ||
    !userLocation
  ) {
    return;
  }

  const url =
    `https://www.google.com/maps/dir/?api=1` +
    `&origin=${userLocation.lat},${userLocation.lon}` +
    `&destination=${selectedPlace.lat},${selectedPlace.lon}`;

  window.open(
    url,
    "_blank"
  );

}


function savePlace() {

  if (!selectedPlace) {
    return;
  }

  let saved =
    JSON.parse(
      localStorage.getItem(
        "wenahSaved"
      ) || "[]"
    );

  const exists =
    saved.some(place =>
      place.name ===
        selectedPlace.name &&
      Math.abs(
        place.lat -
        selectedPlace.lat
      ) < 0.0001
    );

  if (exists) {

    saved =
      saved.filter(place =>
        !(
          place.name ===
            selectedPlace.name &&
          Math.abs(
            place.lat -
            selectedPlace.lat
          ) < 0.0001
        )
      );

    localStorage.setItem(
      "wenahSaved",
      JSON.stringify(saved)
    );

    alert(
      "تمت إزالة المكان من المفضلة ❤️"
    );

  }

  else {

    saved.push(
      selectedPlace
    );

    localStorage.setItem(
      "wenahSaved",
      JSON.stringify(saved)
    );

    alert(
      "تم حفظ المكان بالمفضلة ❤️"
    );

  }

}


function escapeHtml(text) {

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>
